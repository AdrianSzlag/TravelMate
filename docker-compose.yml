version: "3.8"
services:
  mongo:
    image: mongo:7
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27018:27017"

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "npm ci && npm start"
    environment:
      - MONGO_URI=mongodb://mongo:27017/booking
      - PORT=5000
      - NODE_ENV=development
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host --port 5173"
    environment:
      - HOST=0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
